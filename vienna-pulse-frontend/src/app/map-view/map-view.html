<div #map class="h-full w-full"></div>

<section
  aria-labelledby="network-heading"
  class="absolute top-4 left-4 z-10 max-w-[calc(100%-2rem)] rounded-2xl border border-slate-200 bg-white p-4 text-slate-900 shadow-lg sm:top-6 sm:left-6"
>
  <h2 id="network-heading" class="text-lg font-semibold">Filters</h2>

  <div class="mt-4 flex flex-wrap gap-1" role="group" aria-label="Show routes by transport mode">
    @for (mode of modes; track mode.type) {
      <button
        type="button"
        class="min-h-11 rounded-lg px-3 text-sm font-medium hover:bg-slate-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-slate-900"
        [class.bg-slate-900]="selectedMode() === mode.type"
        [class.text-white]="selectedMode() === mode.type"
        [class.hover:bg-slate-800]="selectedMode() === mode.type"
        [attr.aria-pressed]="selectedMode() === mode.type"
        (click)="selectedMode.set(mode.type)"
      >
        {{ mode.label }}
      </button>
    }
  </div>
</section>
