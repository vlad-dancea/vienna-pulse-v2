# The database for local development. Spring Boot starts it with the application (`mise run dev`)
# and connects to it without any configuration. Tests use their own container instead.
services:
  postgres:
    image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    environment:
      POSTGRES_DB: pulse
      POSTGRES_USER: pulse
      # Only reachable from this machine, and holds nothing that cannot be re-imported.
      POSTGRES_PASSWORD: pulse
    ports:
      - "127.0.0.1::5432"
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
