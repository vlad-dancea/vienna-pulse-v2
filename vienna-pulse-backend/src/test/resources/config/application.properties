# Spring Boot reads this file on top of src/main/resources/application.properties. A file at the
# same path as that one would replace it instead.

# Tests set up their own timetable, which an import of the real feed would race and replace.
pulse.importer.import-when-empty=false

# Slice tests such as @JdbcTest would replace the shared PostgreSQL container with an embedded
# database, which the project does not have.
spring.test.database.replace=none

# Tests run the live rounds themselves. TestcontainersConfiguration points them at a MonitorServer
# instead of Wiener Linien, and a context without one finds nothing listening at these addresses.
pulse.live.round-interval=1d
pulse.live.monitor-url=http://127.0.0.1:9/monitor
pulse.live.platforms-url=http://127.0.0.1:9/haltepunkte.csv
