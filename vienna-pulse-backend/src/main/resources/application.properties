logging.structured.format.console=logstash

pulse.importer.feed-url=https://www.wienerlinien.at/ogd_realtime/doku/ogd/gtfs/gtfs.zip
# The feed is about 100 MB. The limit stops a server that keeps sending from filling the disk.
pulse.importer.max-download-size=500MB
pulse.importer.cron=0 0 7 * * *
# New databases and migrations that add a timetable table need an import before the next morning.
pulse.importer.import-when-empty=true
# A failed import tries again after each pause, then waits for the next scheduled run. A short outage
# at wienerlinien.at would otherwise cost a whole day of timetable updates.
pulse.importer.retry-delays=10m,1h,3h

# Wiener Linien's realtime API, whose fair-use rules ask for at least 15 seconds between requests and
# for requests only about the stops someone needs, or they block the client's address. The backend
# asks about the stations whose departures someone opened in the last minute, in one request per
# round, 15 seconds after the last request ended at the earliest. A refusal, which one address got
# with HTTP 403 and code 316 after about 10 requests a minute, pauses the requests for 5 minutes.
pulse.live.monitor-url=https://www.wienerlinien.at/ogd_realtime/monitor
pulse.live.platforms-url=https://www.wienerlinien.at/ogd_realtime/doku/ogd/wienerlinien-ogd-haltepunkte.csv
pulse.live.platform-codes-url=https://www.wienerlinien.at/ogd_realtime/doku/ogd/wienerlinien-ogd-steige.csv
pulse.live.round-interval=15s
# A departures request starts a round itself when it may, so the loop only serves the stations that
# had to wait, and a second's delay is too little for anyone to notice.
pulse.live.check-interval=1s
pulse.live.open-for=60s
pulse.live.max-platforms=100
# A board without live times beats one that waits for them.
pulse.live.timeout=2s
pulse.live.blocked-pause=5m

# The JDK's client, which applies the read timeout to the whole response, so that it bounds the feed
# download too. Spring Boot would otherwise pick Apache HttpClient, which only MonitorClient uses.
spring.http.clients.imperative.factory=jdk
spring.http.clients.connect-timeout=10s
# With the JDK HTTP client, the only one on the classpath, Spring applies the read timeout to the
# whole response, so it also bounds how long the feed download may take.
spring.http.clients.read-timeout=60s

# All stops as GeoJSON shrink from about 640 KB to 80 KB. GeoJSON is not among Spring Boot's
# default compressed types, so the list names it.
server.compression.enabled=true
server.compression.mime-types=application/json,application/geo+json

# API queries are short and only one import runs at a time, so a few connections suffice, and
# each PostgreSQL connection costs memory on the small production server.
spring.datasource.hikari.maximum-pool-size=5
# A request waits at most 2 seconds for a free connection, or for a database that is down, before it
# is answered with a 503 instead of the 30 seconds Hikari waits by default. Since the API's queries
# are cancelled after 5 seconds, the import, which needs one connection, is unlikely to wait in vain.
spring.datasource.hikari.connection-timeout=2000
# Hikari checks a connection that has been idle before handing it out, and that check has to end
# well within the wait above, or a database that stopped answering holds the request for its default
# 5 seconds.
spring.datasource.hikari.validation-timeout=1000
# PgJDBC cancels an API query over its 5 second limit by sending the database a message, one at a
# time from a thread all connections share, and the query waits until its message is sent. With one
# second each instead of the default 10, a frozen database lets all five connections cancel within
# the 10 seconds after which the API stops reading from it. Nothing else cancels queries.
spring.datasource.hikari.data-source-properties.cancelSignalTimeout=1

# Errors, such as a date the timetable does not cover, are answered in the standard format of
# RFC 9457 (application/problem+json) instead of Spring Boot's own.
spring.mvc.problemdetails.enabled=true

# Flyway keeps its history in the connection's current schema, the first in the search path that
# exists. PostgreSQL's default search path starts with "$user", so once V10 created the `pulse`
# schema it shadowed `public` for the `pulse` user, and every later start found no history there.
spring.flyway.default-schema=public

# Health checks get their own port, which nothing routes to from the internet, so the full health
# shows every component's details, such as when the timetable was last imported. Readiness includes
# the database: without it the API can only fail. It leaves out the timetable's age, because an old
# timetable still beats no API.
management.server.port=8081
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.endpoint.health.group.readiness.include=readinessState,db
# The container healthcheck greps readiness for "status":"UP", which a component could also contain.
management.endpoint.health.group.readiness.show-components=never
