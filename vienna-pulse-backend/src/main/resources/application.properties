logging.structured.format.console=logstash

pulse.importer.feed-url=https://www.wienerlinien.at/ogd_realtime/doku/ogd/gtfs/gtfs.zip
# The feed is about 100 MB. The limit stops a server that keeps sending from filling the disk.
pulse.importer.max-download-size=500MB
pulse.importer.cron=0 0 7 * * *
# New databases and upgrades without stop modes or stop times need an import before the next morning.
pulse.importer.import-when-empty=true
# A failed import tries again after each pause, then waits for the next scheduled run. A short outage
# at wienerlinien.at would otherwise cost a whole day of timetable updates.
pulse.importer.retry-delays=10m,1h,3h

spring.http.clients.connect-timeout=10s
# With the JDK HTTP client, the only one on the classpath, Spring applies the read timeout to the
# whole response, so it also bounds how long the feed download may take.
spring.http.clients.read-timeout=60s

# All stops as GeoJSON shrink from about 640 KB to 80 KB. GeoJSON is not among Spring Boot's
# default compressed types, so the list names it.
server.compression.enabled=true
server.compression.mime-types=application/json,application/geo+json

# API queries are short and only one import runs at a time, so a few connections suffice, and
# each PostgreSQL connection costs memory on the small production server.
spring.datasource.hikari.maximum-pool-size=5

# Errors, such as a date the timetable does not cover, are answered in the standard format of
# RFC 9457 (application/problem+json) instead of Spring Boot's own.
spring.mvc.problemdetails.enabled=true

# Health checks get their own port, which nothing routes to from the internet. Readiness includes
# the database: without it the API can only fail.
management.server.port=8081
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
