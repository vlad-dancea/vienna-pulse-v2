# Continuous integration and deployment for the Angular frontend.
#
# Runs the same check task used locally: formatting, typed lint, template accessibility,
# the production build and tests. mise installs the pinned tools, and pnpm installs the
# committed lockfile, so CI uses the same toolchain and dependencies as development.
#
# The repository is a monorepo, and each project gets its own workflow that runs only when
# that project changes. A frontend change never waits for the backend to build.
name: frontend

on:
  push:
    branches: [main]
    paths: &frontend-paths
      - vienna-pulse-frontend/**
      - mise.toml
      # The frontend inherits the repository's whitespace and line-ending rules.
      - .editorconfig
      - .gitattributes
      - .github/workflows/frontend.yml
  pull_request:
    paths: *frontend-paths

# Pull request checks can be replaced; a production deployment must finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Root tool pins also include the JDK; these jobs only need Node and pnpm.
  MISE_ENABLE_TOOLS: node,pnpm

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full commit SHAs keep a moved release tag from changing the code CI runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache_key_prefix: mise-frontend

      - run: mise run //vienna-pulse-frontend:check

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: vienna-pulse-frontend/dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://pulse.vladdancea.com
    concurrency:
      group: deploy-frontend-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache_key_prefix: mise-frontend

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: vienna-pulse-frontend/dist

      # Upload the exact JavaScript and static assets verified by the check job.
      - run: mise run //vienna-pulse-frontend:deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - run: mise run //vienna-pulse-frontend:smoke
