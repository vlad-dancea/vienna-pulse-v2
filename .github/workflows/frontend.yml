# Continuous integration and deployment for the Angular frontend.
#
# Runs the same check task used locally: formatting, typed lint, template accessibility,
# the production build and tests. mise installs the pinned tools, and pnpm installs the
# committed lockfile, so CI uses the same toolchain and dependencies as development.
#
# Pull requests always report a required result, while path filtering keeps expensive
# builds limited to the project that changed. Pushes retain workflow-level path filters.
#
# A pull request from this repository keeps its checked build as an artifact, which
# frontend-preview.yml deploys as a Preview. This workflow never holds a Cloudflare token
# on pull requests, because it runs the pull request's own code.
name: frontend

on:
  push:
    branches: [main]
    paths:
      - vienna-pulse-frontend/**
      - mise.toml
      # The frontend inherits the repository's whitespace and line-ending rules.
      - .editorconfig
      - .gitattributes
      - .github/workflows/frontend.yml
  pull_request:

# Pull request checks can be replaced; a production deployment must finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Root tool pins also include the JDK; these jobs only need Node and pnpm.
  MISE_ENABLE_TOOLS: node,pnpm

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA...$HEAD_SHA" -- 'vienna-pulse-frontend' 'mise.toml' '.github/workflows/frontend.yml' '.editorconfig' '.gitattributes'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            status=$?
            # A missing commit or another diff error must never skip validation.
            if [ "$status" -ne 1 ]; then exit "$status"; fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full commit SHAs keep a moved release tag from changing the code CI runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache_key_prefix: mise-frontend

      - run: mise run //vienna-pulse-frontend:check

      - if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: vienna-pulse-frontend/dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://pulse.vladdancea.com
    concurrency:
      group: deploy-frontend-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache_key_prefix: mise-frontend

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: vienna-pulse-frontend/dist

      # Upload the exact JavaScript and static assets verified by the check job.
      - run: mise run //vienna-pulse-frontend:deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - run: mise run //vienna-pulse-frontend:smoke

      # The same API checks as after a backend deploy, through the Worker that was just deployed.
      - run: mise run //vienna-pulse-backend:smoke

  # This stable check reports even when the project is unchanged, and fails closed when
  # detection, validation or packaging fails or is cancelled.
  required:
    name: frontend-required
    if: always() && github.event_name == 'pull_request'
    needs: [changes, check]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          DETECTION: ${{ needs.changes.result }}
          CHANGED: ${{ needs.changes.outputs.changed }}
          RESULTS: ${{ needs.check.result }}
        run: |
          [ "$DETECTION" = success ] || exit 1
          if [ "$CHANGED" = true ]; then
            [ "$RESULTS" = success ]
          else
            [ "$CHANGED" = false ] && [ "$RESULTS" = skipped ]
          fi
