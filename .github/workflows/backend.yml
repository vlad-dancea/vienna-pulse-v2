# Continuous integration and delivery for the Spring Boot backend.
#
# Runs the backend's `check` task, the same one developers run before pushing: formatting,
# compilation with every javac warning treated as an error, Error Prone, NullAway, doclint and
# the tests. mise installs the JDK pinned in the repository's mise.toml, so CI builds with
# exactly the toolchain used locally. The jar that passed then becomes the container image,
# which main publishes to the GitHub Container Registry.
#
# Pull requests always report a required result, while path filtering keeps expensive
# builds limited to the project that changed. Pushes retain workflow-level path filters.
name: backend

on:
  push:
    branches: [main]
    paths:
      - vienna-pulse-backend/**
      # The production stack and its deploy script, but not its documentation.
      - deploy/**
      - "!deploy/**/*.md"
      # The root mise.toml pins the JDK, so changing it can break the build.
      - mise.toml
      - .github/workflows/backend.yml
  pull_request:

# Only the newest commit of a pull request matters, so a new push cancels the run before it.
# Runs on main finish, so that every commit on main is published.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: jobs only read the repository, unless they ask for more.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/vlad-dancea/vienna-pulse-v2-backend
  PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA...$HEAD_SHA" -- 'vienna-pulse-backend' 'mise.toml' '.github/workflows/backend.yml' 'deploy' ':(glob,exclude)deploy/**/*.md'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            status=$?
            # A missing commit or another diff error must never skip validation.
            if [ "$status" -ne 1 ]; then exit "$status"; fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    # A hung build fails after 20 minutes instead of GitHub's 6-hour default.
    timeout-minutes: 20
    env:
      # Root tool pins also include the frontend; this job only needs Java.
      MISE_ENABLE_TOOLS: java
    steps:
      # Actions are pinned to a full commit SHA: a tag can be moved to different code, a
      # commit cannot. The trailing comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step pushes, so the token is not left behind in .git/config.
          persist-credentials: false

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache_key_prefix: mise-backend

      # Caches Gradle dependencies between runs and verifies the checksum of the
      # committed Gradle wrapper jar.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # The open-source (MIT) cache provider, instead of the proprietary default.
          cache-provider: basic

      - run: mise run //vienna-pulse-backend:check

      # Packages the classes the checks just compiled and tested.
      - run: ./gradlew bootJar --console=plain
        working-directory: vienna-pulse-backend

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-jar
          path: vienna-pulse-backend/build/libs/vienna-pulse.jar
          if-no-files-found: error
          retention-days: 1

  # A separate job without any caches: the image is built only from the tested jar, the
  # Dockerfile and the pinned base image. Pull requests build it too, to prove the Dockerfile.
  image:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write # push to the GitHub Container Registry
      id-token: write # sign the provenance with a short-lived certificate
      attestations: write # store the signed provenance
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-jar
          path: vienna-pulse-backend/build/libs

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: vienna-pulse-backend
          # The production server is x86_64.
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          # Tagged with the commit for people to find it. Deploys go by digest.
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          # The source label links the package to this repository on GitHub.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Vienna Pulse backend
          # A list of every package in the image, stored next to it in the registry.
          sbom: true
          # GitHub's signed attestation below replaces BuildKit's unsigned provenance.
          provenance: false

      # Proves where the image came from: this repository, this workflow, this commit. Anyone
      # can check it with `gh attestation verify oci://<image> --repo vlad-dancea/vienna-pulse-v2`.
      - if: env.PUBLISH == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # Storage records exist only for organisation repositories.
          create-storage-record: false

  # Deploys main to the production server. For the length of the job, the runner joins the
  # tailnet as a device tagged tag:ci, which may reach the server's SSH port and nothing else.
  # There, the deploy user's key can only run the deploy script (deploy/vps/pulse-deploy).
  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://pulse.vladdancea.com/api/stops
    # A deploy never cancels another one halfway. A newer one waits its turn.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      id-token: write # log in to Tailscale with GitHub's identity token instead of a stored secret
    steps:
      - uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          # Identify the federated identity in Tailscale. Neither is a secret.
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci
          ping: ${{ vars.VPS_HOST }}
          # Nothing cached by an earlier run takes part in a deploy.
          use-cache: false

      - name: Deploy over SSH
        env:
          DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
          HOST: ${{ vars.VPS_HOST }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 \
            "deploy@$HOST" "deploy $GITHUB_SHA $DIGEST"

      # Through Cloudflare and the tunnel, as a visitor would. A new database imports the feed
      # in the background after startup, so the stops can take a minute to appear.
      - name: Smoke test
        run: |
          for _ in $(seq 24); do
            if count=$(curl --fail --silent --show-error --compressed \
                https://pulse.vladdancea.com/api/stops | jq '.features | length') && ((count > 0)); then
              echo "The API serves $count stops"
              exit 0
            fi
            sleep 5
          done
          echo "::error::The API serves no stops through Cloudflare"
          exit 1

  # This stable check reports even when the project is unchanged, and fails closed when
  # detection, validation or packaging fails or is cancelled.
  required:
    name: backend-required
    if: always() && github.event_name == 'pull_request'
    needs: [changes, check, image]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          DETECTION: ${{ needs.changes.result }}
          CHANGED: ${{ needs.changes.outputs.changed }}
          RESULTS: ${{ needs.check.result }}:${{ needs.image.result }}
        run: |
          [ "$DETECTION" = success ] || exit 1
          if [ "$CHANGED" = true ]; then
            [ "$RESULTS" = success:success ]
          else
            [ "$CHANGED" = false ] && [ "$RESULTS" = skipped:skipped ]
          fi
