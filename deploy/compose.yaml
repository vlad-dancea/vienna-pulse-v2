# The production stack on the Hetzner server, in /opt/vienna-pulse. The deploy script fetches this
# file from the commit it deploys, so a change here goes live with the next deploy. The secrets and
# the deployed image (BACKEND_TAG and BACKEND_DIGEST in .env) exist only on the server.
#
# Nothing here publishes a port. The internet reaches the backend through the Cloudflare tunnel,
# and the database is on an internal network without internet access.
#
# Memory on the 4 GB server: PostgreSQL 1.5 GB, backend 768 MB, tunnel 128 MB. That leaves about
# 0.9 GB for the system and Docker, plus swap.
name: vienna-pulse

x-logging: &logging
  # Rotated files, so logs cannot fill the disk. `docker compose logs` still reads them.
  driver: local
  options:
    max-size: 10m
    max-file: "5"

services:
  backend:
    # The tag names the commit for people. The digest decides which image actually runs.
    image: ghcr.io/vlad-dancea/vienna-pulse-v2-backend:${BACKEND_TAG:?BACKEND_TAG is not set}@${BACKEND_DIGEST:?BACKEND_DIGEST is not set}
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pulse
      SPRING_DATASOURCE_USERNAME: pulse
      # Spring Boot reads every file in /run/secrets as a property named after the file, so the
      # password never appears in the environment or in `docker inspect`.
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
    secrets:
      - source: db_app_password
        target: spring.datasource.password
    # The image's files cannot change. The importer downloads the feed to /tmp, which is a volume
    # rather than memory, since a 100 MB tmpfs would count against the memory limit.
    read_only: true
    volumes:
      - backend-tmp:/tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    # A swapping JVM crawls. Better to be killed and restarted.
    memswap_limit: 768m
    # Lets running requests finish. The import is one transaction and rolls back if cut off.
    stop_grace_period: 30s
    networks: [default, database]
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  postgres:
    # Same image as development and tests (vienna-pulse-backend/compose.yaml).
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    restart: unless-stopped
    # Sized for the 1.5 GB limit. effective_cache_size only informs the planner and counts the
    # file cache inside this container's limit. The import builds its indexes with one worker at
    # most, so maintenance_work_mem is spent at most twice.
    command:
      - postgres
      - -c
      - shared_buffers=384MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_parallel_maintenance_workers=1
      - -c
      - max_connections=20
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
    secrets: [db_admin_password, db_app_password]
    configs:
      - source: create_app_role
        target: /docker-entrypoint-initdb.d/create-app-role.sql
    volumes:
      # PostgreSQL 18 images keep the data in a versioned folder below this path.
      - postgres-data:/var/lib/postgresql
    # Docker's default of 64 MB is too small for parallel queries.
    shm_size: 256m
    mem_limit: 1536m
    # Time for the shutdown checkpoint, which spares a crash recovery at the next start.
    stop_grace_period: 1m
    networks: [database]
    healthcheck:
      # Over TCP: while the first start sets up the database, a temporary server listens on the
      # Unix socket only, and the backend must not connect yet.
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=pulse", "--dbname=pulse"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s
    logging: *logging

  # Connects outwards to Cloudflare and carries the public traffic in. Cloudflare holds the
  # routes (remotely managed tunnel): pulse-api.vladdancea.com/api/* goes to http://backend:8080.
  tunnel:
    image: cloudflare/cloudflared:2026.10.1@sha256:a15a3b50b8dabd57ac2090e9484c0247dba9dfa1f0df4d298d4317f9d69eb2d5
    restart: unless-stopped
    command: [tunnel, --no-autoupdate, run]
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/tunnel_token
    secrets: [tunnel_token]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    logging: *logging

networks:
  # No internet access: the database only talks to the backend.
  database:
    internal: true

volumes:
  backend-tmp:
  postgres-data:

# Files on the server, readable by the containers' unprivileged users. Their folder is closed to
# everyone but root.
secrets:
  db_admin_password:
    file: ./secrets/db_admin_password
  db_app_password:
    file: ./secrets/db_app_password
  tunnel_token:
    file: ./secrets/tunnel_token

configs:
  # Runs once, on the first start with an empty volume. The backend's role owns its database but
  # is no superuser, so a bug in the backend cannot touch anything else.
  create_app_role:
    content: |
      \set app_password `cat /run/secrets/db_app_password`
      CREATE ROLE pulse LOGIN PASSWORD :'app_password';
      CREATE DATABASE pulse OWNER pulse;
