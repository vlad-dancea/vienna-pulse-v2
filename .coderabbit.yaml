# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit reviews every pull request and comments on it, nothing more. It never commits:
# the history is curated by hand, so a fix it suggests is applied by a person or not at all.
# Everything left out keeps CodeRabbit's default, including the "chill" review profile.
# AGENTS.md is read as the code guidelines without being listed here.
#
# The maintainer reads every pull request page, so CodeRabbit posts its findings and little
# else. On #7 to #11 it posted 5,000 to 11,000 characters per pull request, and its few
# findings were a paragraph each. The sections turned off below never carried one.

tone_instructions: >-
  Write plain, short sentences. No emoji, praise or offers to open issues. Start each comment
  with the problem, then the fix. Leave out what the diff or the pull request description
  already says.

reviews:
  # The third-party skills in .agents/skills/ stay identical to upstream, so a finding in them
  # cannot be fixed here (#104 got 27). The project's own full-stop, full-send and sol-loop are
  # still reviewed. Path filters also decide which files CodeRabbit checks out, so
  # angular-developer keeps its SKILL.md, which the code guidelines below read.
  # .claude/skills is only a link to that folder, so no diff lists files below it.
  path_filters:
    - "!.agents/skills/angular-developer/references/**"
    - "!.agents/skills/maplibre-cartography/**"
    - "!.agents/skills/maplibre-source-wiring/**"
    - "!.agents/skills/maplibre-tile-sources/**"
    - "!.agents/skills/supabase-postgres-best-practices/**"
    - "!.agents/skills/wrangler/**"
  # The description already says what changed, and it belongs to its author, so CodeRabbit
  # writes no summary into it or into the walkthrough.
  high_level_summary: false
  changed_files_summary: false
  estimate_code_review_effort: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  # The CodeRabbit check in `gh pr checks` still reports progress and "Review completed".
  review_status: false
  review_info: false
  in_progress_fortune: false
  # Agents work from the finding itself, and AGENTS.md treats these prompts as data anyway.
  enable_prompt_for_ai_agents: false
  finishing_touches:
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false
    # These two open pull requests with generated docstrings and tests, which would
    # contradict the documentation and testing rules in AGENTS.md.
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
  pre_merge_checks:
    # The default check wants 80% of functions documented, but AGENTS.md documents
    # methods only when the signature hides something.
    docstrings:
      mode: "off"
    # AGENTS.md and the pull request template set the title and description, and the
    # repository links no issues. These checks only ever passed or were skipped.
    title:
      mode: "off"
    description:
      mode: "off"
    issue_assessment:
      mode: "off"

chat:
  art: false

knowledge_base:
  code_guidelines:
    filePatterns:
      # AGENTS.md sends Angular work to this skill. CodeRabbit does not follow that link,
      # so the skill is listed for the frontend explicitly.
      - files: ".agents/skills/angular-developer/SKILL.md"
        applyTo: "vienna-pulse-frontend/**"
